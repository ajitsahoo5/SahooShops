# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# The web config values are public by design (they are sent to every browser).
# Server access relies on the backend service account, so no private keys are configured here.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB8cwJVgoTZPKBzwDFfE-SixeXarEHvac4
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sahoo-shop-prod.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sahoo-shop-prod
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:173184789441:web:fcf6fb72698c4f86b8dd40
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: sahoo-shop-prod
    availability: [RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: sahoo-shop-prod.firebasestorage.app
    availability: [RUNTIME]
  - variable: SESSION_MAX_AGE_DAYS
    value: "5"
    availability: [RUNTIME]
